[package]
name = "sml"
description = "Boost.SML-style finite state machines for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sml-diagram = { path = "../sml-diagram", version = "0.1.0", optional = true }
sml-macros = { path = "../sml-macros", version = "0.1.0" }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
trybuild = "1.0.122"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
tracing = ["dep:tracing"]
diagram = ["dep:sml-diagram", "sml-macros/diagram"]
